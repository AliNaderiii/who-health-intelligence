[theme]
primaryColor = "#2563eb"
backgroundColor = "#f7f8fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
font = "sans serif"

[server]
headless = true
# enableCORS is intentionally left at its default (true): setting it to false
# while enableXsrfProtection is true is incompatible and is overridden at
# startup, producing a warning in the deployment log.
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
